name = "golden-sentence-collection"
account_id = "db0af905306d5d1e74074172d07d001b"
compatibility_date = "2025-01-01"
pages_build_output_dir = "."

# Binds the KV namespace so `wrangler pages dev` works locally too.
# Replace `id` with your namespace's actual ID (shown after you run
# `wrangler kv namespace create QUOTES_KV`). This file is only used
# for local dev / `wrangler pages deploy` — if you deploy by
# connecting the GitHub repo in the Cloudflare dashboard instead, set
# the same binding there under Settings > Functions > KV namespace
# bindings.
[[kv_namespaces]]
binding = "QUOTES_KV"
id = "fe4e1c5ce5e64775b3c6b54313da845c"

# ADMIN_KEY is a secret, not a plaintext var — set it with:
#   wrangler pages secret put ADMIN_KEY
# or in the dashboard under Settings > Environment variables (mark it
# "Encrypt"). Do not add it to this file.
