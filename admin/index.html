<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>金句录 · 管理后台</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="color-scheme" content="light dark" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none';" />
  <link rel="stylesheet" href="../fonts.css" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent:      #39C5BB;
      --accent-dark: #1FA69C;
      --accent-tint: #E6FAF8;
      --danger:      #c0604a;
      --danger-dark: #9b4a2e;
      --ink:      #1a1f1e;
      --paper:    #faf9f6;
      --cream:    #ffffff;
      --muted:    #7c8a88;
      --border:   #e4ece9;
      --hover-bg: #f2f9f8;
      --shadow:   0 10px 30px -12px rgba(20,32,31,.14);
      --ease:     cubic-bezier(.22,.9,.32,1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --accent:      #45D6CB;
        --accent-dark: #7CE8DF;
        --accent-tint: rgba(69,214,203,.14);
        --danger:      #e0836c;
        --danger-dark: #f0a48f;
        --ink:      #eef5f4;
        --paper:    #0f1615;
        --cream:    #131c1b;
        --muted:    #8fa19e;
        --border:   #223330;
        --hover-bg: #16211f;
        --shadow:   0 10px 30px -12px rgba(0,0,0,.55);
      }
    }

    body {
      font-family: 'Noto Serif SC', serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
    }

    a, button { -webkit-tap-highlight-color: transparent; }

    .btn {
      display: inline-flex; align-items: center; gap: .4rem;
      height: 38px; padding: 0 1rem;
      border: 1.5px solid transparent; border-radius: 10px;
      font-size: .8rem; font-family: 'DM Mono', monospace;
      letter-spacing: .02em; cursor: pointer;
      transition: transform .2s var(--ease), box-shadow .2s var(--ease),
                  background-color .2s var(--ease), border-color .2s var(--ease), color .2s var(--ease);
      font-weight: 500; white-space: nowrap;
    }
    .btn:disabled { opacity: .5; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
    .btn-ghost { background: transparent; border-color: var(--border); color: var(--ink); }
    .btn-ghost:hover:not(:disabled) { transform: translateY(-2px); box-shadow: var(--shadow); border-color: transparent; background: var(--hover-bg); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: var(--shadow); background: var(--accent-dark); border-color: var(--accent-dark); }
    .btn-danger { background: transparent; border-color: var(--border); color: var(--danger); }
    .btn-danger:hover:not(:disabled) { border-color: var(--danger); background: var(--danger); color: #fff; }
    .btn svg { width: 14px; height: 14px; flex-shrink: 0; }

    /* ─── LOGIN SCREEN ─── */
    #login-screen {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 1.5rem;
    }
    .login-card {
      width: min(380px, 100%);
      background: var(--cream);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 2.25rem 2rem;
      box-shadow: var(--shadow);
      text-align: center;
    }
    .login-glyph {
      width: 44px; height: 44px; margin: 0 auto 1.1rem;
      background: var(--accent); color: #fff;
      display: grid; place-items: center; border-radius: 12px;
      font-family: 'Lora', serif; font-style: italic; font-size: 1.2rem;
    }
    .login-card h1 { font-family: 'Lora', serif; font-size: 1.25rem; margin-bottom: .4rem; }
    .login-card p { font-size: .82rem; color: var(--muted); margin-bottom: 1.4rem; line-height: 1.6; }
    .login-card input {
      width: 100%; background: var(--paper); border: 1.5px solid var(--border);
      border-radius: 10px; padding: .7rem .9rem;
      font-family: 'DM Mono', monospace; font-size: .9rem; color: var(--ink);
      outline: none; transition: border-color .2s; margin-bottom: .9rem; text-align: center;
      letter-spacing: .05em;
    }
    .login-card input:focus { border-color: var(--accent); }
    .login-card .btn { width: 100%; justify-content: center; }
    .login-error {
      font-size: .78rem; color: var(--danger); margin-top: .8rem;
      min-height: 1.1em;
    }

    /* ─── DASHBOARD ─── */
    #dashboard { display: none; max-width: 880px; margin: 0 auto; padding: 2rem 1.25rem 5rem; }

    .admin-header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 1rem; margin-bottom: 1.75rem; flex-wrap: wrap;
    }
    .admin-header h1 {
      font-family: 'Lora', serif; font-size: 1.35rem; display: flex; align-items: center; gap: .6rem;
    }
    .admin-header .logo-glyph {
      width: 30px; height: 30px; background: var(--accent); color: #fff;
      display: grid; place-items: center; border-radius: 9px;
      font-family: 'Lora', serif; font-style: italic; font-size: .85rem; flex-shrink: 0;
    }
    .admin-header-actions { display: flex; gap: .5rem; flex-wrap: wrap; }

    .panel {
      background: var(--cream); border: 1px solid var(--border); border-radius: 16px;
      padding: 1.5rem; margin-bottom: 1.5rem;
    }
    .panel h2 {
      font-size: .78rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 1.1rem; font-family: 'DM Mono', monospace;
    }

    .form-group { margin-bottom: 1rem; }
    .form-label {
      display: block; font-size: .68rem; letter-spacing: .1em; text-transform: uppercase;
      color: var(--muted); margin-bottom: .4rem; font-family: 'DM Mono', monospace;
    }
    .form-control {
      width: 100%; background: var(--paper); border: 1.5px solid var(--border);
      border-radius: 10px; padding: .6rem .85rem;
      font-family: 'Noto Serif SC', serif; font-size: .9rem; color: var(--ink);
      outline: none; transition: border-color .2s; resize: vertical;
    }
    .form-control:focus { border-color: var(--accent); }
    .form-control::placeholder { color: var(--muted); opacity: .7; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .form-actions { display: flex; justify-content: flex-end; gap: .6rem; margin-top: .3rem; }

    .list-toolbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap;
    }
    .list-toolbar input {
      flex: 1; min-width: 160px;
      background: var(--paper); border: 1.5px solid var(--border);
      border-radius: 10px; padding: .5rem .8rem;
      font-family: 'Noto Serif SC', serif; font-size: .85rem; color: var(--ink);
      outline: none; transition: border-color .2s;
    }
    .list-toolbar input:focus { border-color: var(--accent); }
    .list-count { font-size: .74rem; color: var(--muted); font-family: 'DM Mono', monospace; white-space: nowrap; }

    .quote-row {
      display: flex; align-items: flex-start; gap: 1rem;
      padding: .95rem 0; border-top: 1px solid var(--border);
    }
    .quote-row:first-child { border-top: none; }
    .quote-row-text { flex: 1; min-width: 0; }
    .quote-row-text .text { font-size: .9rem; line-height: 1.6; margin-bottom: .3rem; }
    .quote-row-meta {
      display: flex; gap: .6rem; flex-wrap: wrap; align-items: center;
      font-size: .72rem; color: var(--muted); font-family: 'DM Mono', monospace;
    }
    .quote-row-meta .tag {
      padding: .1rem .55rem; border: 1px solid var(--border); border-radius: 999px;
    }
    .quote-row .btn-danger { flex-shrink: 0; height: 32px; padding: 0 .8rem; font-size: .74rem; }

    .empty-list { text-align: center; padding: 3rem 1rem; color: var(--muted); font-size: .85rem; }

    .toast-container { position: fixed; bottom: 2rem; right: 2rem; z-index: 9000; display: flex; flex-direction: column; gap: .5rem; }
    .toast {
      background: var(--cream); color: var(--ink);
      padding: .7rem 1.15rem; border-radius: 10px; font-size: .8rem;
      border: 1px solid var(--border); border-left: 3px solid var(--accent);
      box-shadow: var(--shadow); animation: toastIn .3s var(--ease);
      font-family: 'DM Mono', monospace; max-width: 320px;
    }
    .toast.err { border-left-color: var(--danger); }
    @keyframes toastIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

    @media (max-width: 560px) {
      .form-row { grid-template-columns: 1fr; }
      .admin-header-actions .btn-label { display: none; }
      .admin-header-actions .btn { padding: 0 .65rem; }
      .quote-row { flex-direction: column; }
    }
  </style>
</head>
<body>

<!-- ═══ LOGIN SCREEN ═══ -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-glyph">「」</div>
    <h1>金句录管理后台</h1>
    <p>输入部署时设置的管理密钥。密钥只保存在这台设备的浏览器里，不会上传，也不会与他人共享。</p>
    <input type="password" id="key-input" placeholder="管理密钥" autocomplete="off" />
    <button class="btn btn-primary" id="login-btn" onclick="login()">进入</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- ═══ DASHBOARD ═══ -->
<div id="dashboard">
  <div class="admin-header">
    <h1><span class="logo-glyph">「」</span>金句录管理后台</h1>
    <div class="admin-header-actions">
      <a class="btn btn-ghost" href="../index.html">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 3L4 8l5 5M4 8h8"/></svg>
        <span class="btn-label">返回站点</span>
      </a>
      <button class="btn btn-ghost" onclick="downloadBackup()">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 1v9M4 7l4 4 4-4M2 12v2h12v-2"/></svg>
        <span class="btn-label">导出备份</span>
      </button>
      <button class="btn btn-ghost" onclick="logout()">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2H3a1 1 0 00-1 1v10a1 1 0 001 1h3M11 11l3-3-3-3M14 8H6"/></svg>
        <span class="btn-label">退出登录</span>
      </button>
    </div>
  </div>

  <div class="panel">
    <h2>添加金句</h2>
    <div class="form-group">
      <label class="form-label">金句正文 *</label>
      <textarea class="form-control" id="f-text" rows="3" placeholder="写下让你心动的句子…"></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">作者 / 来源</label>
        <input class="form-control" id="f-author" type="text" placeholder="如：加缪" />
      </div>
      <div class="form-group">
        <label class="form-label">标签</label>
        <input class="form-control" id="f-tag" type="text" placeholder="如：哲学" />
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" id="add-btn" onclick="addQuote()">保存</button>
    </div>
  </div>

  <div class="panel">
    <h2>全部金句</h2>
    <div class="list-toolbar">
      <input type="text" id="filter-input" placeholder="按正文 / 作者 / 标签筛选…" oninput="renderList()" />
      <span class="list-count" id="list-count"></span>
    </div>
    <div id="quote-list"></div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script>
const API_BASE = '/api/quotes';
const VERIFY_URL = '/api/auth/verify';
const ADMIN_KEY_STORAGE = 'jinjulu_admin_key';

let allQuotes = [];

function getAdminKey() {
  return localStorage.getItem(ADMIN_KEY_STORAGE) || '';
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toast(msg, isError) {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = 'toast' + (isError ? ' err' : '');
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

// ─── AUTH ───────────────────────────────────────────────────────────
async function verifyKey(key) {
  const res = await fetch(VERIFY_URL, {
    method: 'POST',
    headers: { 'X-Admin-Key': key },
  });
  return res.ok;
}

async function login() {
  const input = document.getElementById('key-input');
  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');
  const key = input.value.trim();
  errEl.textContent = '';

  if (!key) { errEl.textContent = '请输入密钥'; return; }

  btn.disabled = true;
  try {
    const ok = await verifyKey(key);
    if (!ok) {
      errEl.textContent = '密钥错误';
      return;
    }
    localStorage.setItem(ADMIN_KEY_STORAGE, key);
    await enterDashboard();
  } catch (e) {
    errEl.textContent = '网络错误，请重试';
  } finally {
    btn.disabled = false;
  }
}

function logout() {
  localStorage.removeItem(ADMIN_KEY_STORAGE);
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('key-input').value = '';
  document.getElementById('key-input').focus();
}

async function enterDashboard() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  try {
    const res = await fetch(API_BASE);
    if (!res.ok) throw new Error('load failed');
    allQuotes = await res.json();
    renderList();
  } catch (e) {
    document.getElementById('quote-list').innerHTML = '<div class="empty-list">加载失败，请刷新重试</div>';
  }
}

// authorizedFetch wraps write requests with the stored key. A 401
// here means the key was revoked/changed server-side after login —
// bounce back to the login screen instead of failing silently.
async function authorizedFetch(url, options) {
  const key = getAdminKey();
  const res = await fetch(url, {
    ...options,
    headers: { ...(options && options.headers), 'X-Admin-Key': key },
  });
  if (res.status === 401) {
    toast('密钥已失效，请重新登录', true);
    logout();
    return null;
  }
  return res;
}

// ─── LIST / FILTER ──────────────────────────────────────────────────
function renderList() {
  const q = document.getElementById('filter-input').value.trim().toLowerCase();
  let list = allQuotes;
  if (q) {
    list = list.filter(item =>
      item.text.toLowerCase().includes(q) ||
      (item.author||'').toLowerCase().includes(q) ||
      (item.tag||'').toLowerCase().includes(q)
    );
  }

  document.getElementById('list-count').textContent = `共 ${allQuotes.length} 条${q ? `，筛选出 ${list.length} 条` : ''}`;

  const el = document.getElementById('quote-list');
  if (!list.length) {
    el.innerHTML = `<div class="empty-list">${q ? '没有匹配的金句' : '暂无金句'}</div>`;
    return;
  }

  el.innerHTML = list.map(item => `
    <div class="quote-row">
      <div class="quote-row-text">
        <div class="text">${escHtml(item.text)}</div>
        <div class="quote-row-meta">
          ${item.author ? `<span>${escHtml(item.author)}</span>` : ''}
          ${item.date ? `<span>${escHtml(item.date)}</span>` : ''}
          ${item.tag ? `<span class="tag">${escHtml(item.tag)}</span>` : ''}
        </div>
      </div>
      <button class="btn btn-danger" data-id="${escHtml(item.id)}">删除</button>
    </div>`).join('');
}

document.getElementById('quote-list').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-id]');
  if (!btn) return;
  deleteQuote(btn.dataset.id);
});

// ─── CRUD ───────────────────────────────────────────────────────────
async function addQuote() {
  const textEl = document.getElementById('f-text');
  const text = textEl.value.trim();
  if (!text) { textEl.focus(); toast('请填写金句正文', true); return; }

  const payload = {
    text,
    author: document.getElementById('f-author').value.trim(),
    tag: document.getElementById('f-tag').value.trim(),
  };

  const btn = document.getElementById('add-btn');
  btn.disabled = true;
  try {
    const res = await authorizedFetch(API_BASE, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!res) return;
    if (!res.ok) { toast('保存失败，请重试', true); return; }
    const saved = await res.json();
    allQuotes.unshift(saved);
    renderList();
    document.getElementById('f-text').value = '';
    document.getElementById('f-author').value = '';
    document.getElementById('f-tag').value = '';
    toast('已添加');
  } catch (e) {
    toast('网络错误，请重试', true);
  } finally {
    btn.disabled = false;
  }
}

async function deleteQuote(id) {
  if (!confirm('确认删除这条金句？此操作不可撤销。')) return;
  try {
    const res = await authorizedFetch(`${API_BASE}/${encodeURIComponent(id)}`, { method: 'DELETE' });
    if (!res) return;
    if (!res.ok && res.status !== 404) { toast('删除失败，请重试', true); return; }
    allQuotes = allQuotes.filter(item => item.id !== id);
    renderList();
    toast('已删除');
  } catch (e) {
    toast('网络错误，请重试', true);
  }
}

// ─── BACKUP ─────────────────────────────────────────────────────────
function downloadBackup() {
  const blob = new Blob([JSON.stringify(allQuotes, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `quotes-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('下载已开始 ↓');
}

// ─── INIT ───────────────────────────────────────────────────────────
document.getElementById('key-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') login();
});

(async function init() {
  const savedKey = getAdminKey();
  if (!savedKey) return; // stay on login screen
  const ok = await verifyKey(savedKey);
  if (ok) {
    await enterDashboard();
  } else {
    localStorage.removeItem(ADMIN_KEY_STORAGE);
  }
})();
</script>
</body>
</html>
