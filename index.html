<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>金句录</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="fonts.css" />
  <script src="quotes.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent:      #39C5BB;
      --accent-dark: #1FA69C;
      --accent-tint: #E6FAF8;
      --danger:      #c0604a;
      --danger-dark: #9b4a2e;
      --ink:      #1a1f1e;
      --paper:    #faf9f6;
      --cream:    #ffffff;
      --muted:    #7c8a88;
      --border:   #e4ece9;
      --hover-bg: #f2f9f8;
      --shadow:   0 10px 30px -12px rgba(20,32,31,.14);
      --ease:     cubic-bezier(.22,.9,.32,1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --accent:      #45D6CB;
        --accent-dark: #7CE8DF;
        --accent-tint: rgba(69,214,203,.14);
        --ink:      #eef5f4;
        --paper:    #0f1615;
        --cream:    #131c1b;
        --muted:    #8fa19e;
        --border:   #223330;
        --hover-bg: #16211f;
        --shadow:   0 10px 30px -12px rgba(0,0,0,.55);
      }
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Noto Serif SC', serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      overflow-x: hidden;
      transition: background-color .3s, color .3s;
    }

    a, button { -webkit-tap-highlight-color: transparent; }

    /* ─── Stagger fade-in (driven by --i custom property) ─── */
    .fade-in {
      opacity: 0;
      transform: translateY(14px);
      animation: up .55s var(--ease) forwards;
      animation-delay: calc(var(--i, 0) * .07s);
    }
    @keyframes up { to { opacity: 1; transform: none; } }

    @media (prefers-reduced-motion: reduce) {
      .fade-in, .quote-card { animation: none !important; opacity: 1 !important; transform: none !important; }
      html { scroll-behavior: auto; }
    }

    /* ─── TOP ROW (intro + actions, top-aligned) ─── */
    .top-row {
      max-width: 1100px;
      margin: 0 auto;
      padding: clamp(1.75rem,5vw,2.75rem) clamp(1.25rem,5vw,3rem) 0;
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 1.5rem; flex-wrap: wrap;
    }

    .header-actions { display: flex; gap: .6rem; align-items: center; flex-shrink: 0; }

    .btn {
      display: inline-flex; align-items: center; gap: .4rem;
      height: 38px; padding: 0 1rem;
      border: 1.5px solid transparent; border-radius: 10px;
      font-size: .8rem; font-family: 'DM Mono', monospace;
      letter-spacing: .02em; cursor: pointer;
      transition: transform .2s var(--ease), box-shadow .2s var(--ease),
                  background-color .2s var(--ease), border-color .2s var(--ease), color .2s var(--ease);
      font-weight: 500; white-space: nowrap;
    }
    .btn-ghost { background: transparent; border-color: var(--border); color: var(--ink); }
    .btn-ghost:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: transparent; background: var(--hover-bg); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: var(--shadow); background: var(--accent-dark); border-color: var(--accent-dark); }
    .btn svg { width:14px; height:14px; flex-shrink:0; }

    /* ─── MAIN LAYOUT ─── */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 clamp(1.25rem,5vw,3rem) 6rem;
    }

    /* ─── INTRO (typography matches the friendlinks/donation page topbar) ─── */
    .intro { max-width: 480px; font-family: 'Nunito', 'Noto Sans SC', sans-serif; }
    .eyebrow {
      font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
      color: var(--accent-dark); margin-bottom: 14px;
    }
    .intro h1 {
      font-family: 'Baloo 2', 'Noto Sans SC', sans-serif;
      font-size: clamp(1.6rem, 4vw, 2rem); font-weight: 700; margin-bottom: 10px;
    }
    .h1-sub { color: var(--muted); font-weight: 500; }
    .intro .subtitle { color: var(--muted); font-size: .95rem; max-width: 400px; }

    hr.rule { border: none; border-top: 1px solid var(--border); margin: 30px 0 22px; }
    .section-label {
      font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 16px; font-family: 'DM Mono', monospace;
    }

    /* ─── STATS BAR ─── */
    .stats-bar { display: flex; align-items: center; gap: 2rem; margin-bottom: 30px; }
    .stat { display: flex; flex-direction: column; gap: .2rem; }
    .stat-num { font-family: 'Lora', serif; font-size: 1.9rem; font-weight: 600; color: var(--accent-dark); line-height: 1; }
    .stat-label { font-size: .68rem; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
    .stats-bar .divider { width: 1px; height: 32px; background: var(--border); }

    /* ─── FILTER STRIP ─── */
    .filter-strip { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 22px; align-items: center; }
    .tag-pill {
      padding: .32rem .9rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: .75rem; font-family: 'DM Mono', monospace;
      cursor: pointer; color: var(--muted);
      background: transparent;
      transition: transform .15s var(--ease), border-color .15s, color .15s, background-color .15s;
    }
    .tag-pill:hover { border-color: var(--accent); color: var(--accent-dark); }
    .tag-pill.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

    /* ─── QUOTE GRID ─── */
    .quote-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
      gap: 1.1rem;
    }

    .quote-card {
      background: var(--cream);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.6rem 1.4rem 1.15rem;
      display: flex; flex-direction: column; gap: .9rem;
      position: relative; overflow: hidden;
      transition: transform .25s var(--ease), box-shadow .25s var(--ease), border-color .25s var(--ease);
      animation: up .5s var(--ease) both;
      animation-delay: calc(var(--i, 0) * .045s);
    }
    .quote-card::before {
      content: '\201C';
      position: absolute; top: -.4rem; left: .75rem;
      font-family: 'Lora', serif; font-size: 4.6rem;
      color: var(--accent); opacity: .1; line-height: 1;
      pointer-events: none;
    }
    .quote-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: transparent; }

    .quote-text { font-size: 1rem; line-height: 1.85; color: var(--ink); font-weight: 400; flex: 1; }

    .quote-footer { display: flex; align-items: flex-end; justify-content: space-between; gap: .5rem; }
    .quote-meta { display: flex; flex-direction: column; gap: .3rem; }
    .quote-author { font-family: 'Lora', serif; font-style: italic; font-size: .85rem; color: var(--accent-dark); }
    .quote-author::before { content: '— '; }
    .quote-date { font-family: 'DM Mono', monospace; font-size: .66rem; color: var(--muted); letter-spacing: .03em; }

    .quote-tag {
      padding: .18rem .6rem; border: 1px solid var(--border); border-radius: 999px;
      font-size: .66rem; font-family: 'DM Mono', monospace; color: var(--muted); white-space: nowrap;
    }

    .quote-actions { display: flex; gap: .3rem; opacity: 0; transition: opacity .2s; }
    .quote-card:hover .quote-actions { opacity: 1; }
    .icon-btn {
      width: 28px; height: 28px; border-radius: 8px;
      display: grid; place-items: center; cursor: pointer;
      border: 1px solid var(--border); background: var(--paper);
      color: var(--muted); transition: all .15s var(--ease);
    }
    .icon-btn:hover { border-color: var(--accent); color: var(--accent-dark); transform: translateY(-1px); }
    .icon-btn.del:hover { border-color: var(--danger); color: var(--danger); }
    .icon-btn svg { width: 13px; height: 13px; }

    /* ─── EMPTY STATE ─── */
    .empty { grid-column: 1/-1; text-align: center; padding: 5rem 2rem; color: var(--muted); }
    .empty-glyph { font-size: 3rem; opacity: .3; margin-bottom: 1rem; }
    .empty p { font-size: .9rem; }

    /* ─── MODAL ─── */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(15,22,21,.5);
      backdrop-filter: blur(3px);
      z-index: 500;
      display: grid; place-items: center;
      opacity: 0; pointer-events: none;
      transition: opacity .25s var(--ease);
    }
    .modal-backdrop.open { opacity: 1; pointer-events: all; }

    .modal {
      background: var(--cream);
      border: 1px solid var(--border);
      border-radius: 20px;
      width: min(560px, calc(100vw - 2rem));
      padding: 2.25rem;
      transform: translateY(20px);
      transition: transform .25s var(--ease);
      box-shadow: var(--shadow);
    }
    .modal-backdrop.open .modal { transform: translateY(0); }

    .modal-title {
      font-family: 'Lora', serif; font-size: 1.3rem; color: var(--ink);
      margin-bottom: 1.6rem; display: flex; align-items: center; gap: .6rem;
    }
    .modal-title svg { color: var(--accent); width: 19px; height: 19px; }

    .form-group { margin-bottom: 1.2rem; }
    .form-label {
      display: block; font-size: .68rem; letter-spacing: .1em; text-transform: uppercase;
      color: var(--muted); margin-bottom: .4rem; font-family: 'DM Mono', monospace;
    }
    .form-control {
      width: 100%; background: var(--paper); border: 1.5px solid var(--border);
      border-radius: 10px; padding: .6rem .85rem;
      font-family: 'Noto Serif SC', serif; font-size: .9rem; color: var(--ink);
      outline: none; transition: border-color .2s; resize: vertical;
    }
    .form-control:focus { border-color: var(--accent); }
    .form-control::placeholder { color: var(--muted); opacity: .7; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    .modal-footer { display: flex; justify-content: flex-end; gap: .6rem; margin-top: 1.8rem; }

    /* ─── EXPORT ACTIONS ─── */
    .export-actions { display: grid; grid-template-columns: 1fr 1fr; gap: .65rem; margin-top: 1.6rem; }
    .export-actions .btn { justify-content: center; padding: .7rem 1rem; font-size: .78rem; }

    /* ─── TOAST ─── */
    .toast-container { position: fixed; bottom: 2rem; right: 2rem; z-index: 9000; display: flex; flex-direction: column; gap: .5rem; }
    .toast {
      background: var(--cream); color: var(--ink);
      padding: .7rem 1.15rem; border-radius: 10px; font-size: .8rem;
      border: 1px solid var(--border); border-left: 3px solid var(--accent);
      box-shadow: var(--shadow); animation: toastIn .3s var(--ease);
      font-family: 'DM Mono', monospace;
    }
    @keyframes toastIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

    /* ─── SCROLLBAR ─── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--paper); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

    /* ─── HEADER SEARCH ─── */
    .header-search { position: relative; display: flex; align-items: center; }
    .search-toggle {
      width: 38px; height: 38px; display: grid; place-items: center;
      border: 1.5px solid var(--border); border-radius: 10px;
      background: transparent; color: var(--ink);
      cursor: pointer; transition: all .2s var(--ease); flex-shrink: 0; z-index: 2;
    }
    .search-toggle:hover { border-color: var(--accent); color: var(--accent-dark); }
    .search-toggle svg { width: 15px; height: 15px; }

    .header-search-input {
      position: absolute; right: 44px; top: 50%; transform: translateY(-50%);
      width: 0; overflow: hidden;
      background: var(--cream);
      border: 1.5px solid transparent; border-radius: 10px;
      color: var(--ink);
      font-family: 'Noto Serif SC', serif; font-size: .85rem;
      padding: 0; outline: none;
      transition: width .3s var(--ease), padding .3s, border-color .2s, opacity .2s;
      opacity: 0; white-space: nowrap;
    }
    .header-search-input::placeholder { color: var(--muted); }
    .header-search.open .header-search-input {
      width: 220px; padding: .45rem .85rem; border-color: var(--accent); opacity: 1; box-shadow: var(--shadow);
    }
    .header-search.open .search-toggle { background: var(--accent); color: #fff; border-color: var(--accent); }

    .hl { background: var(--accent-tint); color: var(--accent-dark); border-radius: 3px; padding: 0 1px; }

    /* ─── FOOTER ─── */
    footer {
      text-align: center; padding: 2.5rem 1rem 3rem;
      border-top: 1px solid var(--border);
      display: flex; flex-direction: column; align-items: center; gap: 1rem;
      margin-top: 12px;
    }
    .footer-links { display: flex; align-items: center; gap: 1.25rem; }
    .footer-author {
      display: inline-flex; align-items: center; gap: .4rem;
      font-family: 'Lora', serif; font-style: italic; font-size: .88rem; color: var(--muted);
      text-decoration: none; transition: color .2s;
    }
    .footer-author:hover { color: var(--accent-dark); }
    .footer-author svg { width: 14px; height: 14px; flex-shrink: 0; }

    .footer-github {
      display: inline-flex; align-items: center; gap: .4rem;
      font-family: 'DM Mono', monospace; font-size: .73rem;
      letter-spacing: .05em; text-transform: uppercase;
      color: var(--muted); text-decoration: none;
      padding: .32rem .85rem; border: 1px solid var(--border); border-radius: 999px;
      transition: all .2s var(--ease);
    }
    .footer-github:hover { color: #fff; background: var(--accent); border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow); }
    .footer-github svg { width: 14px; height: 14px; }

    .footer-dot { width: 3px; height: 3px; border-radius: 50%; background: var(--border); }
    .footer-powered {
      font-family: 'DM Mono', monospace; font-size: .68rem; letter-spacing: .1em; text-transform: uppercase;
      color: var(--muted); opacity: .7; text-decoration: none; transition: opacity .2s, color .2s;
    }
    .footer-powered:hover { opacity: 1; color: var(--accent-dark); }

    @media (max-width: 600px) {
      /* Not enough width to open the search box inline next to the
         title — stack the whole action bar below the intro instead
         of letting it get squeezed or overlap. */
      .top-row {
        flex-direction: column;
        align-items: flex-start;
        padding-left: 1rem; padding-right: 1rem;
        gap: 1rem;
      }
      .intro { max-width: 100%; }
      .header-actions { width: 100%; flex-wrap: wrap; gap: .45rem; }

      .stats-bar { gap: 1.1rem; }
      .form-row { grid-template-columns: 1fr; }
      main { padding-left: 1rem; padding-right: 1rem; padding-bottom: 4rem; }

      .btn .btn-label { display: none; }
      .btn { padding: 0 .65rem; }

      /* The search box now drops down below the icon row (full
         content width) instead of expanding sideways, so it never
         gets clipped by the edge of a narrow screen. */
      .header-search-input {
        right: auto; left: 0; top: 100%; transform: none;
        margin-top: .5rem;
        width: 0;
      }
      .header-search.open .header-search-input {
        width: calc(100vw - 2rem);
        max-width: 420px;
      }

      .quote-actions { opacity: 1; }
      .modal { padding: 1.6rem 1.15rem; }
    }
  </style>
</head>
<body>

<!-- ═══ TOP ROW: intro + actions, top-aligned ═══ -->
<div class="top-row">
  <div class="intro fade-in" style="--i:0">
    <p class="eyebrow">Personal quote archive</p>
    <h1>金句录 <span class="h1-sub">/ Golden Sentences</span></h1>
    <p class="subtitle">收藏那些让你心动的句子</p>
  </div>
  <div class="header-actions fade-in" style="--i:0">
    <div class="header-search" id="header-search">
      <input
        class="header-search-input" id="search"
        placeholder="搜索金句或作者…"
        oninput="render()"
        onkeydown="if(event.key==='Escape')closeSearch()"
      />
      <button class="search-toggle" id="search-toggle" onclick="toggleSearch()" aria-label="搜索">
        <svg id="search-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="6.5" cy="6.5" r="4.5"/><path d="M10.5 10.5l3 3"/>
        </svg>
        <svg id="search-close" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
          <path d="M3 3l10 10M13 3L3 13"/>
        </svg>
      </button>
    </div>
    <button class="btn btn-ghost" onclick="openExport()">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M8 1v9M4 7l4 4 4-4M2 12v2h12v-2"/>
      </svg>
      <span class="btn-label">导出配置</span>
    </button>
    <button class="btn btn-primary" onclick="openAdd()">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M8 2v12M2 8h12"/>
      </svg>
      <span class="btn-label">添加金句</span>
    </button>
  </div>
</div>

<!-- ═══ MAIN ═══ -->
<main>
  <hr class="rule fade-in" style="--i:1">

  <div class="stats-bar fade-in" style="--i:2">
    <div class="stat">
      <span class="stat-num" id="stat-total">0</span>
      <span class="stat-label">总计</span>
    </div>
    <div class="divider"></div>
    <div class="stat">
      <span class="stat-num" id="stat-tags">0</span>
      <span class="stat-label">分类</span>
    </div>
    <div class="divider"></div>
    <div class="stat">
      <span class="stat-num" id="stat-today">0</span>
      <span class="stat-label">今日新增</span>
    </div>
  </div>

  <div class="filter-strip fade-in" style="--i:3" id="filter-strip">
    <button class="tag-pill active" data-tag="all" onclick="filterTag('all',this)">全部</button>
  </div>

  <p class="section-label fade-in" style="--i:4">金句列表</p>

  <div class="quote-grid fade-in" style="--i:5" id="quote-grid"></div>
</main>

<!-- ═══ ADD MODAL ═══ -->
<div class="modal-backdrop" id="add-modal" onclick="closeOnBackdrop(event,'add-modal')">
  <div class="modal">
    <div class="modal-title">
      <svg viewBox="0 0 20 20" fill="currentColor"><path d="M10.75 4.75a.75.75 0 00-1.5 0v4.5h-4.5a.75.75 0 000 1.5h4.5v4.5a.75.75 0 001.5 0v-4.5h4.5a.75.75 0 000-1.5h-4.5v-4.5z"/></svg>
      添加金句
    </div>
    <div class="form-group">
      <label class="form-label">金句正文 *</label>
      <textarea class="form-control" id="f-text" rows="4" placeholder="写下让你心动的句子…"></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">作者 / 来源</label>
        <input class="form-control" id="f-author" type="text" placeholder="如：加缪" />
      </div>
      <div class="form-group">
        <label class="form-label">标签</label>
        <input class="form-control" id="f-tag" type="text" placeholder="如：哲学" />
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('add-modal')">取消</button>
      <button class="btn btn-primary" onclick="addQuote()">保存</button>
    </div>
  </div>
</div>

<!-- ═══ EXPORT MODAL ═══ -->
<div class="modal-backdrop" id="export-modal" onclick="closeOnBackdrop(event,'export-modal')">
  <div class="modal">
    <div class="modal-title">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M8 3H5a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V8m-4-5h4v4M10 12l4-4"/>
      </svg>
      导出 quotes.js
    </div>
    <p style="font-size:.88rem;color:var(--muted);line-height:1.75;">
      将当前所有金句导出为新的配置文件。用它替换项目中的
      <code style="font-family:'DM Mono',monospace;color:var(--accent-dark);font-size:.82rem">quotes.js</code>
      并重新部署，即可永久保存所有改动。
    </p>
    <div class="export-actions">
      <button class="btn btn-ghost" onclick="copyExport()">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="5" y="5" width="9" height="9" rx="1"/><path d="M10 5V3a1 1 0 00-1-1H3a1 1 0 00-1 1v6a1 1 0 001 1h2"/>
        </svg>
        复制到剪贴板
      </button>
      <button class="btn btn-primary" onclick="downloadExport()">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M8 1v9M4 7l4 4 4-4M2 12v2h12v-2"/>
        </svg>
        直接下载
      </button>
    </div>
    <div class="modal-footer" style="margin-top:1.25rem;">
      <button class="btn btn-ghost" onclick="closeModal('export-modal')">关闭</button>
    </div>
  </div>
</div>

<!-- ═══ FOOTER ═══ -->
<footer>
  <div class="footer-links">
    <a class="footer-author" href="https://minecraftxfj.top" target="_blank" rel="noopener">

<!-- ═══ TOAST ═══ -->
<div class="toast-container" id="toast-container"></div>

<script>
// ─── DATA ──────────────────────────────────────────────────────────────
const STORAGE_KEY = 'jinjulu_quotes';

function loadAll() {
  const base = (window.QUOTES_CONFIG || []);
  let local = [];
  try { local = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch(e){}
  const map = new Map();
  base.forEach(q => map.set(q.id, q));
  local.forEach(q => map.set(q.id, q));
  const arr = Array.from(map.values());
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function saveLocal(quotes) {
  const configIds = new Set((window.QUOTES_CONFIG||[]).map(q=>q.id));
  const localOnly = quotes.filter(q => !configIds.has(q.id));
  localStorage.setItem(STORAGE_KEY, JSON.stringify(localOnly));
}

function getDeletedIds() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY + '_deleted') || '[]'); } catch(e){ return []; }
}
function addDeletedId(id) {
  const ids = getDeletedIds();
  if (!ids.includes(id)) ids.push(id);
  localStorage.setItem(STORAGE_KEY + '_deleted', JSON.stringify(ids));
}

let allQuotes = [];
let activeTag = 'all';

function highlight(text, query) {
  if (!query) return escHtml(text);
  const re = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi');
  return escHtml(text).replace(re, '<span class="hl">$1</span>');
}

// ─── RENDER ─────────────────────────────────────────────────────────
function render() {
  const deleted = new Set(getDeletedIds());
  const query = document.getElementById('search').value.trim().toLowerCase();

  let list = allQuotes.filter(q => !deleted.has(q.id));

  if (activeTag !== 'all') list = list.filter(q => q.tag === activeTag);
  if (query) list = list.filter(q =>
    q.text.toLowerCase().includes(query) ||
    (q.author||'').toLowerCase().includes(query) ||
    (q.tag||'').toLowerCase().includes(query)
  );

  const grid = document.getElementById('quote-grid');

  if (!list.length) {
    grid.innerHTML = `<div class="empty">
      <div class="empty-glyph">「 」</div>
      <p>${query ? '没有找到匹配的金句' : '暂无金句，点击右上角添加第一条'}</p>
    </div>`;
    return;
  }

  // Rebuilt from an array + join, and copy/delete buttons carry only a
  // data-id — no user text is ever interpolated into an HTML attribute,
  // which is what silently broke the old copy button.
  grid.innerHTML = list.map((q, i) => `
    <div class="quote-card" style="--i:${i}; animation-delay:${i * 0.045}s">
      <div class="quote-text">${highlight(q.text, query)}</div>
      <div class="quote-footer">
        <div class="quote-meta">
          ${q.author ? `<span class="quote-author">${highlight(q.author, query)}</span>` : ''}
          ${q.date   ? `<span class="quote-date">${q.date}</span>` : ''}
        </div>
        <div style="display:flex;align-items:center;gap:.5rem;">
          ${q.tag ? `<span class="quote-tag">${escHtml(q.tag)}</span>` : ''}
          <div class="quote-actions">
            <button class="icon-btn" title="复制" data-action="copy" data-id="${q.id}">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="5" y="5" width="9" height="9" rx="1"/><path d="M10 5V3a1 1 0 00-1-1H3a1 1 0 00-1 1v6a1 1 0 001 1h2"/>
              </svg>
            </button>
            <button class="icon-btn del" title="删除" data-action="delete" data-id="${q.id}">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M3 4h10M6 4V2h4v2M13 4l-.8 9a1 1 0 01-1 .9H4.8a1 1 0 01-1-.9L3 4"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>`).join('');
}

// Delegated click handler for card actions — set once, works for every
// card even after re-render, and never touches inline onclick strings.
document.getElementById('quote-grid').addEventListener('click', (e) => {
  const btn = e.target.closest('.icon-btn');
  if (!btn) return;
  const id = btn.dataset.id;
  if (btn.dataset.action === 'copy') {
    const q = allQuotes.find(x => x.id === id);
    if (q) copyText(q.text);
  } else if (btn.dataset.action === 'delete') {
    deleteQuote(id);
  }
});

function updateStats() {
  const deleted = new Set(getDeletedIds());
  const visible = allQuotes.filter(q => !deleted.has(q.id));
  const today = new Date().toISOString().slice(0,10);
  document.getElementById('stat-total').textContent = visible.length;
  document.getElementById('stat-tags').textContent = new Set(visible.map(q=>q.tag).filter(Boolean)).size;
  document.getElementById('stat-today').textContent = visible.filter(q=>q.date===today).length;
}

function buildTagPills() {
  const deleted = new Set(getDeletedIds());
  const visible = allQuotes.filter(q => !deleted.has(q.id));
  const tags = [...new Set(visible.map(q=>q.tag).filter(Boolean))].sort();
  const strip = document.getElementById('filter-strip');
  const pills = strip.querySelectorAll('.tag-pill:not([data-tag="all"])');
  pills.forEach(p => p.remove());
  tags.forEach(tag => {
    const btn = document.createElement('button');
    btn.className = 'tag-pill' + (activeTag === tag ? ' active' : '');
    btn.dataset.tag = tag;
    btn.textContent = tag;
    btn.onclick = () => filterTag(tag, btn);
    strip.appendChild(btn);
  });
}

function filterTag(tag, el) {
  activeTag = tag;
  document.querySelectorAll('.tag-pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  render();
}

// ─── CRUD ───────────────────────────────────────────────────────────
function addQuote() {
  const text = document.getElementById('f-text').value.trim();
  if (!text) { shake('f-text'); return; }
  const today = new Date().toISOString().slice(0,10);
  const q = {
    id: 'q' + Date.now(),
    text,
    author: document.getElementById('f-author').value.trim(),
    tag:    document.getElementById('f-tag').value.trim(),
    date:   today
  };
  allQuotes.unshift(q);
  saveLocal(allQuotes);
  buildTagPills();
  updateStats();
  render();
  closeModal('add-modal');
  toast('金句已收录 ✦');
}

function deleteQuote(id) {
  addDeletedId(id);
  allQuotes = allQuotes.filter(q => q.id !== id);
  saveLocal(allQuotes);
  buildTagPills();
  updateStats();
  render();
  toast('已删除');
}

// ─── EXPORT ─────────────────────────────────────────────────────────
let _exportContent = '';

function buildExportContent() {
  const deleted = new Set(getDeletedIds());
  const visible = allQuotes.filter(q => !deleted.has(q.id));
  return `/**\n * 金句配置文件\n * 由「金句录」自动生成 ${new Date().toISOString().slice(0,10)}\n */\n\nwindow.QUOTES_CONFIG = ${JSON.stringify(visible, null, 2)};\n`;
}

function openExport() {
  _exportContent = buildExportContent();
  openModal('export-modal');
}

function copyExport() {
  copyToClipboard(_exportContent, () => {
    toast('已复制到剪贴板 ✓');
    closeModal('export-modal');
  });
}

function downloadExport() {
  const blob = new Blob([_exportContent], { type: 'text/javascript' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'quotes.js';
  a.click();
  URL.revokeObjectURL(url);
  toast('下载已开始 ↓');
  closeModal('export-modal');
}

// ─── MODAL ──────────────────────────────────────────────────────────
function openAdd() {
  ['f-text','f-author','f-tag'].forEach(id => document.getElementById(id).value='');
  openModal('add-modal');
}

function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function closeOnBackdrop(e, id) { if (e.target.id === id) closeModal(id); }

// ─── CLIPBOARD ──────────────────────────────────────────────────────
// navigator.clipboard.writeText only works in a secure context
// (https / localhost). On plain http, or when permission is denied,
// it silently rejects — which is why the old copy button looked
// "broken". This falls back to a hidden-textarea + execCommand copy
// so it keeps working everywhere, and always reports success/failure.
function copyText(text) {
  copyToClipboard(text, () => toast('已复制 ✓'));
}

function copyToClipboard(text, onSuccess) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(onSuccess, () => fallbackCopy(text, onSuccess));
  } else {
    fallbackCopy(text, onSuccess);
  }
}

function fallbackCopy(text, onSuccess) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.position = 'fixed';
  ta.style.top = '0';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch(e) { ok = false; }
  document.body.removeChild(ta);
  if (ok) onSuccess();
  else toast('复制失败，请长按手动选择文本');
}

// ─── UTILITIES ──────────────────────────────────────────────────────
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function shake(id) {
  const el = document.getElementById(id);
  el.style.animation = 'none';
  el.style.borderColor = 'var(--danger)';
  setTimeout(() => el.style.borderColor = '', 800);
}

function toast(msg) {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

// ─── HEADER SEARCH ──────────────────────────────────────────────────
function toggleSearch() {
  const wrap = document.getElementById('header-search');
  const isOpen = wrap.classList.contains('open');
  if (isOpen) { closeSearch(); } else { openSearch(); }
}

function openSearch() {
  const wrap = document.getElementById('header-search');
  wrap.classList.add('open');
  document.getElementById('search-icon').style.display  = 'none';
  document.getElementById('search-close').style.display = '';
  setTimeout(() => document.getElementById('search').focus(), 320);
}

function closeSearch() {
  const wrap = document.getElementById('header-search');
  wrap.classList.remove('open');
  document.getElementById('search-icon').style.display  = '';
  document.getElementById('search-close').style.display = 'none';
  document.getElementById('search').value = '';
  render();
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeModal('add-modal'); closeModal('export-modal');
    closeSearch();
  }
  if ((e.metaKey||e.ctrlKey) && e.key === 'k') {
    e.preventDefault(); openSearch();
  }
});

// ─── INIT ───────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  allQuotes = loadAll();
  buildTagPills();
  updateStats();
  render();
});
</script>
